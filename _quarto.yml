project:
  type: website
  output-dir: _site
  resources:
    - images/hendralogo.png

website:
  title: "Nor Hendra"
  navbar:
    background: light
    title: false
    logo: images/hendralogo.png
    logo-alt: "Hendra Logo"
    logo-href: "/"
    left:
      - text: "Hands-on Exercise"
        menu:
          - text: "Hands-on Exercise 1A"
            href: "Hands-on_Ex/Hands-on_Ex01/Hands-on_Ex01A.html"
          - text: "Hands-on Exercise 1B"
            href: "Hands-on_Ex/Hands-on_Ex01/Hands-on_Ex01B.html"
    right:
      - href: index.qmd
        text: Home
  page-footer:
    left: "Nor Hendra · ISSS626 Geospatial Analytics & Applications, SMU"
    right: "Built with Quarto"
    border: false

format:
  html:
    # Two themes → Quarto renders a light/dark toggle in the navbar automatically.
    # First entry is the default (light); the toggle flips to the second (dark).
    theme:
      light: cosmo
      dark:
        - cosmo
        - styles-dark.scss
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    include-before-body: _includes/preloader.html
    include-after-body:
      - _includes/reveal.html
      - _includes/ui.html

editor: visual
