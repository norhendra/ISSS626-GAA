<script>
  (function () {
    function initReveal() {
      var targets = document.querySelectorAll(
        '.quarto-listing .card, .quarto-grid-item, main > section, main .callout'
      );
      if (!('IntersectionObserver' in window) || targets.length === 0) return;
      targets.forEach(function (el) { el.classList.add('reveal-up'); });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
      targets.forEach(function (el) { io.observe(el); });
    }
    if (document.readyState !== 'loading') { initReveal(); }
    else { document.addEventListener('DOMContentLoaded', initReveal); }
  })();
</script>
