<!-- Announcement banner -->
<div id="announcement-banner" style="
  background-color: #90EE90;
  color: #000000;
  font-weight: 600;
  padding: 8px 0;
  font-size: 1rem;
  font-family: inherit;
  overflow: hidden;
  white-space: nowrap;
  border-bottom: 1px solid #333;
  z-index: 1030;
  position: relative;
">
  <div id="announcement-text" style="
    display: inline-block;
    animation: marquee 15s linear infinite;
    padding-left: 100%;
  ">
    📣 In-class Exercise 5 uploaded on 26 September 2026  | Take-home Exercise 1: Technical Report and Executive Summary uploaded </div>
</div>

<style>
@keyframes marquee {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}
#announcement-banner:hover #announcement-text {
  animation-play-state: paused;
}
.navbar {
  z-index: 1040 !important;
}
.navbar .dropdown-menu {
  z-index: 1050 !important;
}
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const banner = document.getElementById("announcement-banner");
    const navbar = document.querySelector(".navbar");
    if (navbar && banner) {
      navbar.parentNode.insertBefore(banner, navbar.nextSibling);
    }
  });
</script>

<button id="back-to-top" aria-label="Back to top" title="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
  </svg>
</button>

<script>
  (function () {
    /* ---- Scroll progress bar ---- */
    var bar = document.createElement('div');
    bar.id = 'scroll-progress';
    document.body.appendChild(bar);

    var btt = document.getElementById('back-to-top');

    function onScroll() {
      var h = document.documentElement;
      var scrollTop = h.scrollTop || document.body.scrollTop;
      var height = h.scrollHeight - h.clientHeight;
      var pct = height > 0 ? (scrollTop / height) * 100 : 0;
      bar.style.width = pct + '%';

      if (btt) {
        if (scrollTop > 400) { btt.classList.add('show'); }
        else { btt.classList.remove('show'); }
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    onScroll();

    /* ---- Back to top ---- */
    if (btt) {
      btt.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    /* ---- SGT clock ---- */
    function tickClock() {
      var el = document.getElementById('sgt-clock');
      if (!el) return;
      try {
        var now = new Date().toLocaleTimeString('en-GB', {
          timeZone: 'Asia/Singapore',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        el.textContent = now + ' SGT';
      } catch (e) {
        el.textContent = new Date().toLocaleTimeString();
      }
    }
    tickClock();
    setInterval(tickClock, 1000);
  })();
</script>
