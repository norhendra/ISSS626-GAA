<div id="site-preloader">
  <div class="preloader-inner">
    <svg class="loader-globe" viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
      <defs>
        <linearGradient id="loaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#17A398"/>
          <stop offset="100%" stop-color="#6C5CE7"/>
        </linearGradient>
      </defs>
      <circle class="ring" cx="60" cy="60" r="52" fill="none"
              stroke="url(#loaderGrad)" stroke-width="3"
              stroke-linecap="round" stroke-dasharray="180 200"/>
      <g class="graticule" fill="none" stroke="url(#loaderGrad)" stroke-width="1.4" opacity="0.9">
        <circle cx="60" cy="60" r="36"/>
        <ellipse cx="60" cy="60" rx="14" ry="36"/>
        <ellipse cx="60" cy="60" rx="30" ry="36"/>
        <line x1="24" y1="60" x2="96" y2="60"/>
        <line x1="60" y1="24" x2="60" y2="96"/>
      </g>
      <circle class="node" cx="60" cy="8" r="4" fill="#22D3EE"/>
    </svg>
    <div class="preloader-label">Nor&nbsp;Hendra</div>
    <div class="preloader-sub">Geospatial Analytics &amp; Applications</div>
    <div class="preloader-bar"><span></span></div>
  </div>
</div>

<style>
  #site-preloader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(800px 400px at 20% 10%, rgba(23,163,152,0.10), transparent 60%),
      radial-gradient(700px 380px at 90% 20%, rgba(108,92,231,0.10), transparent 55%),
      #F4F6F5;
    transition: opacity 0.6s ease, visibility 0.6s ease;
    font-family: "Space Grotesk", -apple-system, sans-serif;
  }
  #site-preloader.hide { opacity: 0; visibility: hidden; }
  .preloader-inner { text-align: center; }
  .loader-globe { display: block; margin: 0 auto 1.2rem; }

  .loader-globe .ring     { transform-origin: 60px 60px; animation: loaderSpin 1.6s linear infinite; }
  .loader-globe .graticule{ transform-origin: 60px 60px; animation: loaderTilt 4s ease-in-out infinite; }
  .loader-globe .node     { transform-origin: 60px 60px; animation: loaderOrbit 2.2s linear infinite;
                            filter: drop-shadow(0 0 6px rgba(34,211,238,0.8)); }
  @keyframes loaderSpin  { to { transform: rotate(360deg); } }
  @keyframes loaderOrbit { to { transform: rotate(360deg); } }
  @keyframes loaderTilt  { 0%,100% { transform: rotateZ(0deg) scaleX(1); } 50% { transform: rotateZ(8deg) scaleX(0.96); } }

  .preloader-label {
    font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em;
    background: linear-gradient(120deg, #0E7C74, #6C5CE7);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .preloader-sub {
    margin-top: 0.25rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: #647079;
  }
  .preloader-bar {
    margin: 1.3rem auto 0; width: 180px; height: 3px;
    background: #E4E6E1; border-radius: 999px; overflow: hidden;
  }
  .preloader-bar span {
    display: block; height: 100%; width: 40%;
    background: linear-gradient(90deg, #17A398, #6C5CE7, #22D3EE);
    border-radius: 999px;
    animation: loaderBar 1.1s ease-in-out infinite;
  }
  @keyframes loaderBar { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

  /* dark preloader */
  @media (prefers-color-scheme: dark) {
    #site-preloader {
      background:
        radial-gradient(800px 400px at 20% 10%, rgba(47,212,196,0.12), transparent 60%),
        radial-gradient(700px 380px at 90% 20%, rgba(155,140,255,0.12), transparent 55%),
        #0E1518;
    }
    .preloader-sub { color: #8A97A0; }
    .preloader-bar { background: #26333A; }
  }

  @media (prefers-reduced-motion: reduce) {
    #site-preloader * { animation: none !important; }
  }
</style>

<script>
  (function () {
    function hidePreloader() {
      var el = document.getElementById('site-preloader');
      if (!el) return;
      setTimeout(function () { el.classList.add('hide'); }, 550);
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 1300);
    }
    if (document.readyState === 'complete') { hidePreloader(); }
    else {
      window.addEventListener('load', hidePreloader);
      setTimeout(hidePreloader, 4000);
    }
  })();
</script>
