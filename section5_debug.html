<div class="cell">
<p>I noticed the reference applies <code>rjitter()</code> to the childcare ppp object before continuing. This step is worth paying attention to, since spatstat’s second-order functions such as <code>Gest()</code> and <code>Kest()</code> are distance-based, and if two points share the exact same coordinates the nearest neighbour distance between them becomes zero, which can distort the estimated function near the origin. Jittering nudges duplicate points apart by a tiny random amount so this does not happen.</p>
